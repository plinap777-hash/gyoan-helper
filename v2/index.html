<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="세종형 질문·탐구·성찰 수업장학용 지도안 도우미 — 교과 탐구 독서·질문중심 수업 지도안과 AI 프롬프트 생성기">
<title>수업장학 지도안 도우미 2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>질문중심 수업지도안 &amp; AI 프롬프트 생성기</h1>
    <p id="subTitle">세종형 「질문·탐구·성찰」 · 초등 교과 탐구 독서 수업 지도안</p>
  </div>
  <div class="top-actions">
    <select id="typeSel" aria-label="지도안 유형" class="btn ghost" style="padding:8px 10px">
      <option value="read">① 교과 탐구 독서</option>
      <option value="extra">② 질문중심 수업</option>
    </select>
    <button class="btn" id="btnPG" title="주제·질문·활동지·평가·동료장학 질문 등을 만들 AI 프롬프트를 생성합니다">✦ AI 프롬프트 생성기</button>
    <button class="btn ghost" id="btnAI" title="쓰던 AI에게 한 번에 초안을 받아 모든 칸을 채웁니다">AI로 한 번에 만들기</button>
    <button class="btn ghost" id="btnBlank">빈 양식 보기</button>
    <button class="btn ghost" id="btnSample" title="양식 예시(수학)를 불러와 작성 흐름을 확인합니다">예시 불러오기</button>
    <button class="btn ghost" id="btnSave">작업 저장(.json)</button>
    <label class="btn ghost" for="fileLoad">작업 불러오기</label>
    <input type="file" id="fileLoad" accept=".json,application/json" hidden>
    <button class="btn ghost danger" id="btnReset">새로 시작</button>
  </div>
</header>

<nav class="steps" id="steps" aria-label="작성 단계"></nav>

<main class="layout">
  <section class="form-col" id="formCol" aria-live="polite"></section>
  <aside class="side-col" id="sideCol"></aside>
</main>

<footer class="foot">
  <span id="saveState">브라우저에 자동 저장됩니다.</span>
  <span>입력한 내용은 이 기기의 브라우저에만 저장되며 서버로 전송되지 않습니다.</span>
</footer>

<div class="toast" id="toast" role="status"></div>
<script src="vendor/docx.js"></script>
<script src="data/standards.js"></script>
<script src="data/content.js"></script>
<script src="app.js"></script>
</body>
</html>
